name: koda_app
description: Koda Companion Robot Control App
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # BLE
  flutter_blue_plus: ^1.32.12

  # Voice
  flutter_tts: ^4.0.2
  speech_to_text: ^7.3.0

  # HTTP / API
  http: ^1.2.1

  # Camera
  camera: ^0.10.5+9

  # Storage
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3
  path: ^1.9.0

  # Permissions
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  image: ^4.8.0
  wakelock_plus: ^1.4.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/context/
